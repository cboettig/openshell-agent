# Build the compute sandbox image for amd64 and arm64 and publish it to GHCR.
#
# Both architectures build on NATIVE runners -- ubuntu-24.04 for amd64 and
# ubuntu-24.04-arm for arm64 -- rather than under QEMU. That matters here: the
# image is ~10GB and compiles nothing under emulation would make tolerable.
# Native arm64 hosted runners are free for public repositories, which this is.
#
# Each architecture pushes by digest, and a final job stitches the two digests
# into one manifest list, so `--from ghcr.io/.../compute:latest` resolves to the
# right architecture automatically.
name: Build sandbox image

on:
  push:
    branches: [main]
    paths:
      - 'sandboxes/compute/Dockerfile'
      - '.github/workflows/build-sandbox.yml'
  # Weekly, because the whole point of the derived image is a CURRENT Claude
  # Code -- the upstream community base went stale exactly this way.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}/compute

jobs:
  build:
    name: build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      # A hosted runner has ~14GB free and the image is ~10GB, so this is not
      # optional -- without it the build dies on ENOSPC partway through export.
      - name: Reclaim disk
        run: |
          echo "before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/local/share/powershell "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          echo "after:"; df -h / | tail -1

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./sandboxes/compute
          platforms: ${{ matrix.platform }}
          provenance: false
          # No layer cache on purpose: the only cacheable layers are small (apt,
          # node, venv) while the base is ~9GB, so a cache would cost more to
          # move than it saves, and GHA cache is capped at 10GB per repo anyway.
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      # The digest is the filename, with its "sha256:" prefix stripped --
      # upload-artifact rejects a colon in a path. The merge job puts it back.
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"
          echo "${{ matrix.platform }} -> ${digest}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

  merge:
    name: merge manifest
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:latest" \
            --tag "${IMAGE}:${GITHUB_SHA::12}" \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Show what was published
        run: |
          docker buildx imagetools inspect "${IMAGE}:latest"
          echo "Pin a sandbox to this build with:"
          echo "  openshell sandbox create --from ${IMAGE}:${GITHUB_SHA::12} --policy ./sandboxes/compute/policy.yaml"
