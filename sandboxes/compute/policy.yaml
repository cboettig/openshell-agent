# OpenShell policy for the "compute" sandbox -- the LOCKED flavor, and the default.
#
#   openshell sandbox create --from ./sandboxes/compute --policy ./sandboxes/compute/policy.yaml
#
# This is the built-in default policy (captured from a live sandbox on 2026-09-07,
# openshell 0.0.116) with the package-fetch egress removed and every remaining GitHub
# host L7-inspected. Passing --policy REPLACES the built-in default outright, so the
# parts we keep are reproduced verbatim -- when you upgrade openshell, re-capture with:
#
#   openshell policy get <sandbox> --base -o json
#
# and diff, so upstream additions to the default don't silently go missing.
#
# THE POSTURE: the image is complete, so nothing here needs CRAN, PyPI, or a GitHub
# tarball, and the install-time arbitrary-code-execution surface that comes with them
# does not exist. Fetching a package means running its configure/build scripts as the
# sandbox user -- a larger uninspected-code surface than the apt repositories this
# sandbox cannot use anyway (no root, and no_new_privs is set, so apt is off the table
# at runtime regardless). Add a package by rebuilding the image, not by opening a host.
# When you genuinely do not know the dependencies yet, policy-open.yaml restores cran
# and pypi -- deliberately, visibly, and reversibly, including on a running sandbox.
#
# Dropped from the built-in default:
#   cran, pypi          the package-fetch endpoints, and with them R's github.com /
#                       codeload / objects.githubusercontent.com access.
#   codex, copilot,     unused agents. Each was standing egress for a tool we do not
#   cursor, vscode,     run; an allowlist entry that is never exercised is only a way
#   opencode,           in. policy-open.yaml is the place to re-add one.
#   nvidia_inference
#   github_rest_api     read-only api.github.com for gh/claude. Not needed to compute;
#                       read the credential note below before re-adding it.
#
# Kept:
#   claude_code             the agent and its updater, plus the endpoints that let
#                           `claude update` work from inside a running sandbox --
#                           downloads.claude.ai for the manifest and native binary,
#                           registry.npmjs.org for the npm path, mcp-proxy for
#                           connectors. Without them the updater fails silently and
#                           the only trace is $HOME/.claude/.last-update-result.json.
#                           /usr/lib/node_modules/@anthropic-ai/** is allowlisted
#                           because `npm install -g` resolves to a NATIVE binary
#                           there; the stock /usr/bin/node entry does not cover it.
#   github_ssh_over_https   GET info/refs + POST git-upload-pack, i.e. clone and fetch
#                           only. The info/refs wildcard is broad enough to permit the
#                           receive-pack *advertisement*, but the POST that carries the
#                           pack is not allowed, so a push fails before it sends. This
#                           is the one deliberate egress beyond Anthropic: the analysis
#                           code has to get in somehow. Drop it and use
#                           `openshell sandbox upload` if you want Anthropic-only.
#
# WHY EVERY GITHUB HOST IS L7 AND NOT A BARE host:port. Two reasons, both measured on
# 0.0.116, and they apply to any host you add later:
#
#   1. A bare host:port entry is an UNINSPECTED L4 tunnel. Attach any provider that
#      carries a GitHub credential and `sandbox create` refuses outright:
#        credentialed endpoint 'github.com:443' in rule 'cran' uses L4-only;
#        configure L7 inspection or explicitly set allow_uninspected_credentials: true
#      An L4 tunnel is exactly where a credential leaves without the proxy seeing it, so
#      the fix is inspection, never the allow_uninspected_credentials escape hatch. The
#      same check fires on a live `openshell policy set`, not just on create.
#
#   2. github.com:443 is ONE credential domain per sandbox. Overlapping endpoints for
#      the same host:port must agree on credential_binding or the gateway rejects the
#      policy:
#        network policies 'gh-ops-record' endpoint[1] (github.com:443) and 'cran'
#        endpoint[4] (github.com:443) overlap on port(s) 443 with conflicting metadata
#      So a sandbox cannot let git push carry a scoped token while
#      remotes::install_github() goes unauthenticated. One scoped credential per
#      sandbox, which is a boundary rather than a limitation: the scope is fixed before
#      the agent starts and it cannot widen itself. See the README for the placeholder
#      mechanism this enables.
#
# GitHub's content hosts count too -- raw/objects/release-assets/origin-tracker
# .githubusercontent.com and codeload.github.com serve private-repo tarballs and raw
# files, so they accept a GitHub token. All GET+HEAD where present. L7 does not truncate
# binaries: an R download.file() of a codeload tarball arrives as valid gzip and unpacks.
#
# Deliberately denied: http-intake.logs.us5.datadoghq.com (optional telemetry, was
# failing harmlessly). `tls: terminate` was dropped throughout -- it is the default now
# and only produced a CONFIG:VALIDATED warning on every boot.

version: 1
filesystem_policy:
  include_workdir: true
  read_only:
  - /usr
  - /lib
  - /proc
  - /dev/urandom
  - /app
  - /etc
  - /var/log
  - /opt
  read_write:
  - /sandbox
  - /tmp
  - /dev/null
landlock:
  compatibility: best_effort
network_policies:
  claude_code:
    name: claude-code
    binaries:
    - path: /usr/local/bin/claude
    - path: /usr/bin/node
    - path: /usr/bin/claude
    - path: /usr/lib/node_modules/@anthropic-ai/**
    - path: /sandbox/.local/bin/claude
    - path: /sandbox/.local/share/claude/**
    endpoints:
    - host: api.anthropic.com
      port: 443
      protocol: rest
      access: full
      enforcement: enforce
    - host: statsig.anthropic.com
      port: 443
    - host: sentry.io
      port: 443
    - host: raw.githubusercontent.com
      port: 443
      protocol: rest
      enforcement: enforce
      rules:
      - allow:
          method: GET
          path: '**'
      - allow:
          method: HEAD
          path: '**'
    - host: platform.claude.com
      port: 443
    - host: downloads.claude.ai
      port: 443
    - host: mcp-proxy.anthropic.com
      port: 443
    - host: registry.npmjs.org
      port: 443
  github_ssh_over_https:
    name: github-clone-readonly
    binaries:
    - path: /usr/bin/git
    endpoints:
    - host: github.com
      port: 443
      protocol: rest
      enforcement: enforce
      rules:
      - allow:
          path: /**/info/refs*
          method: GET
      - allow:
          path: /**/git-upload-pack
          method: POST
process:
  run_as_group: sandbox
  run_as_user: sandbox
