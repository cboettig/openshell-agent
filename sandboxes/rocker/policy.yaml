# OpenShell sandbox policy for the rocker sandbox.
#
#   openshell sandbox create --from ./sandboxes/rocker --policy ./sandboxes/rocker/policy.yaml
#
# This is the built-in default policy (captured from a live sandbox on 2026-09-07,
# openshell 0.0.116) plus the claude_code changes noted below. Passing --policy REPLACES
# the built-in default outright, so everything else here is reproduced verbatim -- when
# you upgrade openshell, re-capture with:
#
#   openshell policy get <sandbox> --base -o json
#
# and diff, so upstream additions to the default don't silently go missing.
#
# Changes vs. the stock default, all in claude_code:
#
#   endpoints
#     downloads.claude.ai       version manifest + native binary. Its absence is why the
#                               sandbox was pinned at Claude Code 2.1.156 (Opus 4.8) --
#                               every `claude update` was DENIED at the proxy.
#     mcp-proxy.anthropic.com   MCP connectors; was denied in a tight retry loop.
#     registry.npmjs.org        the npm-install path for `claude update`.
#
#   binaries
#     /usr/bin/claude                        npm prefix here is /usr, so `npm install -g`
#                                            lands the launcher at /usr/bin, not /usr/local.
#     /usr/lib/node_modules/@anthropic-ai/** the native binary npm unpacks -- it, not node,
#                                            is what the proxy sees exec'ing. Mirrors how
#                                            the stock policy handles @openai and @github.
#     /sandbox/.local/bin/claude             a self-update writes here: HOME for the sandbox
#     /sandbox/.local/share/claude/**        user is /sandbox, and /usr is read-only at
#                                            runtime, so an in-place update relocates.
#
# Added for this image:
#
#   cran                      R is the reason for the base image; install.packages() and
#                             remotes::install_github() need somewhere to fetch from.
#   pypi /opt/venv/bin/*      rocker keeps its Python in /opt/venv, not /sandbox/.venv.
#
# github.com / api.github.com are L7 read-only (GET+HEAD) in cran, pypi and copilot rather
# than the stock bare host:port. Two reasons, both measured on 0.0.116:
#
# The same applies to GitHub's content hosts -- raw/objects/release-assets/origin-tracker
# .githubusercontent.com and codeload.github.com -- which serve private-repo tarballs and
# raw files and therefore accept a GitHub token. All are GET+HEAD. Verified that L7 does
# not truncate binaries: an R download.file() of a codeload tarball arrives as valid gzip
# and unpacks. (telemetry.enterprise.githubcopilot.com is left L4 on purpose: it takes a
# Copilot credential, not a GitHub one, and we do not use Copilot.)
#
#   1. A bare host:port entry is an UNINSPECTED L4 tunnel. Attach any provider that
#      carries a GitHub credential and `sandbox create` refuses outright:
#        credentialed endpoint 'github.com:443' in rule 'cran' uses L4-only;
#        configure L7 inspection or explicitly set allow_uninspected_credentials: true
#      An L4 tunnel is exactly where a credential leaves without the proxy seeing it, so
#      the fix is inspection, never the allow_uninspected_credentials escape hatch.
#
#   2. github.com:443 is ONE credential domain per sandbox. Overlapping endpoints for the
#      same host:port must agree on credential_binding or the gateway rejects the policy:
#        network policies 'gh-ops-record' endpoint[1] (github.com:443) and 'cran'
#        endpoint[4] (github.com:443) overlap on port(s) 443 with conflicting metadata
#      So you cannot let git push carry a token while remotes::install_github() goes
#      unauthenticated. A sandbox that WRITES to GitHub under a scoped token must drop
#      github.com from cran/pypi entirely -- which is why writing and computing belong in
#      separate sandboxes. Read-only here keeps this sandbox on the computing side.
#
# Deliberately still denied: http-intake.logs.us5.datadoghq.com (optional telemetry, was
# failing harmlessly). `tls: terminate` was dropped throughout -- it is the default now and
# only produced a CONFIG:VALIDATED warning on every boot.

version: 1
filesystem_policy:
  include_workdir: true
  read_only:
  - /usr
  - /lib
  - /proc
  - /dev/urandom
  - /app
  - /etc
  - /var/log
  read_write:
  - /sandbox
  - /tmp
  - /dev/null
landlock:
  compatibility: best_effort
network_policies:
  claude_code:
    name: claude-code
    binaries:
    - path: /usr/local/bin/claude
    - path: /usr/bin/node
    - path: /usr/bin/claude
    - path: /usr/lib/node_modules/@anthropic-ai/**
    - path: /sandbox/.local/bin/claude
    - path: /sandbox/.local/share/claude/**
    endpoints:
    - host: api.anthropic.com
      port: 443
      protocol: rest
      access: full
      enforcement: enforce
    - host: statsig.anthropic.com
      port: 443
    - host: sentry.io
      port: 443
    - host: raw.githubusercontent.com
      port: 443
      protocol: rest
      enforcement: enforce
      rules:
      - allow:
          method: GET
          path: '**'
      - allow:
          method: HEAD
          path: '**'
    - host: platform.claude.com
      port: 443
    - host: downloads.claude.ai
      port: 443
    - host: mcp-proxy.anthropic.com
      port: 443
    - host: registry.npmjs.org
      port: 443
  codex:
    name: codex
    binaries:
    - path: /usr/bin/codex
    - path: /usr/bin/node
    - path: /usr/lib/node_modules/@openai/**
    endpoints:
    - host: api.openai.com
      port: 443
    - host: auth.openai.com
      port: 443
    - host: chatgpt.com
      port: 443
  copilot:
    name: copilot
    binaries:
    - path: /usr/bin/copilot
    - path: /usr/lib/node_modules/@github/copilot/node_modules/@github/**/copilot
    endpoints:
    - host: github.com
      port: 443
      protocol: rest
      enforcement: enforce
      rules:
      - allow:
          method: GET
          path: '**'
      - allow:
          method: HEAD
          path: '**'
    - host: api.github.com
      port: 443
      protocol: rest
      access: read-only
      enforcement: enforce
    - host: api.githubcopilot.com
      port: 443
      protocol: rest
      access: read-write
      enforcement: enforce
    - host: api.individual.githubcopilot.com
      port: 443
      protocol: rest
      access: read-write
      enforcement: enforce
    - host: api.business.githubcopilot.com
      port: 443
      protocol: rest
      access: read-write
      enforcement: enforce
    - host: api.enterprise.githubcopilot.com
      port: 443
      protocol: rest
      access: read-write
      enforcement: enforce
    - host: copilot-proxy.githubusercontent.com
      port: 443
      protocol: rest
      access: read-write
      enforcement: enforce
    - host: origin-tracker.githubusercontent.com
      port: 443
      protocol: rest
      enforcement: enforce
      rules:
      - allow:
          method: GET
          path: '**'
      - allow:
          method: HEAD
          path: '**'
    - host: telemetry.enterprise.githubcopilot.com
      port: 443
    - host: default.exp-tas.com
      port: 443
    - host: release-assets.githubusercontent.com
      port: 443
      protocol: rest
      enforcement: enforce
      rules:
      - allow:
          method: GET
          path: '**'
      - allow:
          method: HEAD
          path: '**'
  cran:
    name: cran
    binaries:
    - path: /usr/lib/R/bin/exec/R
    - path: /usr/bin/R
    - path: /usr/bin/Rscript
    - path: /usr/lib/R/bin/Rscript
    endpoints:
    - host: cloud.r-project.org
      port: 443
    - host: cran.r-project.org
      port: 443
    - host: p3m.dev
      port: 443
    - host: packagemanager.posit.co
      port: 443
    - host: github.com
      port: 443
      protocol: rest
      enforcement: enforce
      rules:
      - allow:
          method: GET
          path: '**'
      - allow:
          method: HEAD
          path: '**'
    - host: api.github.com
      port: 443
      protocol: rest
      access: read-only
      enforcement: enforce
    - host: objects.githubusercontent.com
      port: 443
      protocol: rest
      enforcement: enforce
      rules:
      - allow:
          method: GET
          path: '**'
      - allow:
          method: HEAD
          path: '**'
    - host: codeload.github.com
      port: 443
      protocol: rest
      enforcement: enforce
      rules:
      - allow:
          method: GET
          path: '**'
      - allow:
          method: HEAD
          path: '**'
  cursor:
    name: cursor
    binaries:
    - path: /usr/bin/curl
    - path: /usr/bin/wget
    - path: /sandbox/.cursor-server/**
    endpoints:
    - host: cursor.blob.core.windows.net
      port: 443
    - host: api2.cursor.sh
      port: 443
    - host: repo.cursor.sh
      port: 443
    - host: download.cursor.sh
      port: 443
    - host: cursor.download.prss.microsoft.com
      port: 443
  github_rest_api:
    name: github-rest-api
    binaries:
    - path: /usr/local/bin/claude
    - path: /usr/bin/gh
    endpoints:
    - host: api.github.com
      port: 443
      protocol: rest
      access: read-only
      enforcement: enforce
  github_ssh_over_https:
    name: github-ssh-over-https
    binaries:
    - path: /usr/bin/git
    endpoints:
    - host: github.com
      port: 443
      protocol: rest
      enforcement: enforce
      rules:
      - allow:
          path: /**/info/refs*
          method: GET
      - allow:
          path: /**/git-upload-pack
          method: POST
  nvidia_inference:
    name: nvidia-inference
    binaries:
    - path: /usr/bin/curl
    - path: /bin/bash
    - path: /usr/local/bin/opencode
    endpoints:
    - host: integrate.api.nvidia.com
      port: 443
  opencode:
    name: opencode
    binaries:
    - path: /usr/lib/node_modules/opencode-ai/bin/.opencode
    - path: /usr/bin/node
    - path: /usr/local/bin/opencode
    endpoints:
    - host: registry.npmjs.org
      port: 443
    - host: opencode.ai
      port: 443
    - host: integrate.api.nvidia.com
      port: 443
  pypi:
    name: pypi
    binaries:
    - path: /sandbox/.venv/bin/python
    - path: /sandbox/.venv/bin/python3
    - path: /sandbox/.venv/bin/pip
    - path: /app/.venv/bin/python
    - path: /app/.venv/bin/python3
    - path: /app/.venv/bin/pip
    - path: /usr/local/bin/uv
    - path: /sandbox/.uv/python/**
    - path: /opt/venv/bin/python
    - path: /opt/venv/bin/python3
    - path: /opt/venv/bin/pip
    - path: /opt/venv/bin/uv
    endpoints:
    - host: pypi.org
      port: 443
    - host: files.pythonhosted.org
      port: 443
    - host: github.com
      port: 443
      protocol: rest
      enforcement: enforce
      rules:
      - allow:
          method: GET
          path: '**'
      - allow:
          method: HEAD
          path: '**'
    - host: objects.githubusercontent.com
      port: 443
      protocol: rest
      enforcement: enforce
      rules:
      - allow:
          method: GET
          path: '**'
      - allow:
          method: HEAD
          path: '**'
    - host: api.github.com
      port: 443
      protocol: rest
      access: read-only
      enforcement: enforce
    - host: downloads.python.org
      port: 443
  vscode:
    name: vscode
    binaries:
    - path: /usr/bin/curl
    - path: /usr/bin/wget
    - path: /sandbox/.vscode-server/**
    - path: /sandbox/.vscode-remote-containers/**
    endpoints:
    - host: update.code.visualstudio.com
      port: 443
    - host: az764295.vo.msecnd.net
      port: 443
    - host: vscode.download.prss.microsoft.com
      port: 443
    - host: marketplace.visualstudio.com
      port: 443
    - host: gallerycdn.vsassets.io
      port: 443
process:
  run_as_group: sandbox
  run_as_user: sandbox
